<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio 1: FORMULARIOS</title>
    <link rel="stylesheet" href="plantilla/css/bootstrap.min.css">
</head>

<body>
    <div class="container py-4">
        <form action="">
            <div class="mb-3"><!--mb-3 margin botom de 3px-->
                <label class="form-label" for="formfile">Input file predetermindado</label>
                <input class="form-control" type="file" id="formfile">
            </div>
            <div class="mb-3">
                <label class="form-label" for="formfileMultiple">Input file mùltiple</label>
                <input class="form-control" type="file" id="formfileMultiple" multiple>
            </div>
            <div class="mb-3">
                <label class="form-label" for="formfileDisabled">Input file desablitado</label>
                <input class="form-control" type="file" id="formfileMultipleDisabled" disabled>
            </div>
            <hr>
            <div class="mb-3"><!--clase fs-* (1,2,3,4,5,6)-->
                <label class="form-label fs-3 text-warning" for="formfilelg">Input file lg</label>
                <input class="form-control form-control-lg" type="file" id="formfilelg">
            </div>
            <hr>
            <div class="mb-3">
                <label class="form-label" for="formfilesm">Input file sm</label>
                <input class="form-control form-control-sm" type="file" id="formfilesm">
            </div>
            <hr>
            <div class="mb-3">
                <label class="form-label text-primary" for="colorInput">Selector de color</label>
                <input class="form-control form-control-color" type="color">
            </div>
        </form>

    </div>



    <script src="plantilla/js/bootstrap.bundle.min.js"></script>
</body>

</html>
