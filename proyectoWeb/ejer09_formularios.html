<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio 1: FORMULARIOS</title>
    <link rel="stylesheet" href="plantilla/css/bootstrap.min.css">
</head>

<body>
    <div class="container">
        <form action="">
            <div class="mb-3">
                <label class="form-label" for="name">Nombre</label>
                <input class="form-control" type="text" id="name" placeholder="Por favor ingrese su nombre" disabled>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" type="email" id="email" placeholder="Por favor ingrese su email" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="description">Descripciòn</label>
                <textarea class="form-control form-control-sm" name="description" id="description" placeholder="Por favor escriba una breve descripciòn" cols="30" rows="10"></textarea>
            </div>
        </form>
    </div>



    <script src="plantilla/js/bootstrap.bundle.min.js"></script>
</body>

</html>
